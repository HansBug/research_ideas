[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-stm-evaluation"
version = "0.60.0"
description = "Offline evaluation and final-results reproduction for paper1."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_stm_evaluation*"]
