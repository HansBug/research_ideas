[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-stm-semantic-judge"
version = "3.6.0"
description = "Independent issue #195 Semantic Judge for paper1 artifacts."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.10,<3",
  "httpx>=0.28,<1",
  "PyYAML>=6.0",
  "genai-prices==0.1.3",
  "langchain==1.3.4",
  "langchain-openai==1.2.2",
  "openai==2.41.0",
  "pyfcstm @ git+https://github.com/HansBug/pyfcstm.git@901f30e981c29eb8e304b33d61985652d2e85b2e",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
paper-stm-semantic-judge = "paper_stm_judge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["paper_stm_judge*", "utils*"]

[tool.setuptools.package-data]
paper_stm_judge = ["resources/*.md", "release_manifest.json"]
