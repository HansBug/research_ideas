<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="780" viewBox="0 0 1260 780" role="img" aria-labelledby="title desc">
  <title id="title">S0-v2 方法普通流程图</title>
  <desc id="desc">图中按 L0 到 L7 展示系统综述支持流程：研究者设定综述元模型并批准维度模式，智能体按批准模式收集和分析论文，研究者质疑并裁决最终发现；G2 和 G4 是左侧反馈门控，G6 是右侧过程证据边界。</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#2f5f9f" />
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#b23b3b" />
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#7e57c2" />
    </marker>
    <style>
      .title { font-family: sans-serif; font-size: 24px; font-weight: 700; fill: #111; }
      .subtitle { font-family: sans-serif; font-size: 15px; fill: #333; }
      .band { fill: #f8fbff; stroke: #d0ddec; stroke-width: 1.5; rx: 20; }
      .card { fill: #eef5ff; stroke: #3b6ea8; stroke-width: 2; rx: 14; }
      .cardAgent { fill: #edf8f3; stroke: #2e7d5b; stroke-width: 2; rx: 14; }
      .cardMix { fill: #fff7e6; stroke: #b36b00; stroke-width: 2; rx: 14; }
      .feedback { fill: #fdecea; stroke: #b23b3b; stroke-width: 2; rx: 14; }
      .audit { fill: #f3e8ff; stroke: #7e57c2; stroke-width: 2; stroke-dasharray: 8 5; rx: 18; }
      .bandHead { font-family: sans-serif; font-size: 17px; font-weight: 700; fill: #111; }
      .cardHead { font-family: sans-serif; font-size: 15px; font-weight: 700; fill: #111; }
      .body { font-family: sans-serif; font-size: 12.5px; fill: #111; }
      .small { font-family: sans-serif; font-size: 11.5px; fill: #333; }
      .label { font-family: sans-serif; font-size: 12px; fill: #111; font-weight: 600; }
      .arrowBlue { stroke: #2f5f9f; stroke-width: 2.2; fill: none; marker-end: url(#arrowBlue); }
      .arrowRed { stroke: #b23b3b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowRed); }
      .arrowAudit { stroke: #7e57c2; stroke-width: 1.8; fill: none; stroke-dasharray: 5 5; marker-end: url(#arrowPurple); opacity: 0.75; }
    </style>
  </defs>

  <rect x="0" y="0" width="1260" height="780" fill="#ffffff" />
  <text x="630" y="36" text-anchor="middle" class="title">研究者引导、模式演化、证据支撑、发现导向的智能体式系统综述支持方法</text>
  <text x="630" y="62" text-anchor="middle" class="subtitle">蓝色为主流程；绿色节点为智能体执行；橙色节点为统计 / 输出；红色为研究者反馈门控；紫色为过程证据边界</text>

  <g id="feedback-lane">
    <text x="130" y="102" text-anchor="middle" class="bandHead">反馈门控</text>
    <rect x="35" y="305" width="210" height="78" class="feedback" />
    <text x="52" y="330" class="cardHead">G2 模式演化反馈</text>
    <text x="52" y="354" class="small">新类型 / 字段失效</text>
    <text x="52" y="374" class="small">研究者批准修订与回填</text>
    <rect x="35" y="520" width="210" height="78" class="feedback" />
    <text x="52" y="545" class="cardHead">G4 研究者质疑反馈</text>
    <text x="52" y="569" class="small">证据不足 / 主张过强</text>
    <text x="52" y="589" class="small">回到补证、找反例或降级</text>
  </g>

  <g id="phase1">
    <rect x="270" y="88" width="660" height="150" class="band" />
    <text x="292" y="118" class="bandHead">阶段一：问题设定与模式准备</text>
    <rect x="292" y="138" width="190" height="74" class="card" />
    <text x="307" y="162" class="cardHead">L0 / G0 综述元模型</text>
    <text x="307" y="183" class="body">研究者：主题、问题、范围</text>
    <text x="307" y="202" class="small">产物：综述元模型与批准记录</text>
    <rect x="505" y="138" width="190" height="74" class="cardAgent" />
    <text x="520" y="162" class="cardHead">L1 脚手架与种子探测</text>
    <text x="520" y="183" class="body">智能体：提出候选维度</text>
    <text x="520" y="202" class="small">研究者：采纳或拒绝</text>
    <rect x="718" y="138" width="190" height="74" class="card" />
    <text x="733" y="162" class="cardHead">L2 / G1 维度模式批准</text>
    <text x="733" y="183" class="body">研究者：批准字段树</text>
    <text x="733" y="202" class="small">产物：可执行维度模式</text>
  </g>

  <g id="phase2">
    <rect x="270" y="286" width="660" height="160" class="band" />
    <text x="292" y="316" class="bandHead">阶段二：论文收集与字段分析</text>
    <rect x="292" y="336" width="190" height="76" class="cardAgent" />
    <text x="307" y="360" class="cardHead">L3 论文收集与概览</text>
    <text x="307" y="382" class="body">智能体：检索、去重、筛选</text>
    <text x="307" y="401" class="small">产物：概览卡与全文状态</text>
    <rect x="505" y="336" width="190" height="76" class="cardAgent" />
    <text x="520" y="360" class="cardHead">L4 内容证据抽取</text>
    <text x="520" y="382" class="body">智能体：抽取来源锚点</text>
    <text x="520" y="401" class="small">产物：字段证据表</text>
    <rect x="718" y="336" width="190" height="76" class="cardMix" />
    <text x="733" y="360" class="cardHead">L5 / G3 统计分析</text>
    <text x="733" y="382" class="body">研究者：批准统计协议</text>
    <text x="733" y="401" class="small">产物：统计观察</text>
  </g>

  <g id="phase3">
    <rect x="270" y="496" width="660" height="160" class="band" />
    <text x="292" y="526" class="bandHead">阶段三：发现形成与透明输出</text>
    <rect x="292" y="546" width="190" height="78" class="cardAgent" />
    <text x="307" y="570" class="cardHead">L6 候选发现形成</text>
    <text x="307" y="592" class="body">智能体：提出候选发现</text>
    <text x="307" y="611" class="small">状态：仍不是最终发现</text>
    <rect x="505" y="546" width="190" height="78" class="card" />
    <text x="520" y="570" class="cardHead">L7：G4质疑→G5裁决</text>
    <text x="520" y="592" class="body">研究者：质疑、补证、最终裁决</text>
    <text x="520" y="611" class="small">结果：接受 / 降级 / 拒绝 / 未解决</text>
    <rect x="718" y="546" width="190" height="78" class="cardMix" />
    <text x="733" y="570" class="cardHead">透明材料输出</text>
    <text x="733" y="592" class="body">主张-证据映射</text>
    <text x="733" y="611" class="small">报告只是裁决结果投影</text>
  </g>

  <path d="M482 175 L505 175" class="arrowBlue" />
  <path d="M695 175 L718 175" class="arrowBlue" />
  <path d="M813 212 L813 255 L387 255 L387 336" class="arrowBlue" />
  <text x="565" y="272" text-anchor="middle" class="label">批准后的维度模式进入正式抽取</text>

  <path d="M482 374 L505 374" class="arrowBlue" />
  <path d="M695 374 L718 374" class="arrowBlue" />
  <path d="M813 412 L813 470 L387 470 L387 546" class="arrowBlue" />
  <text x="565" y="485" text-anchor="middle" class="label">字段证据表与统计观察进入发现形成</text>

  <path d="M482 585 L505 585" class="arrowBlue" />
  <path d="M695 585 L718 585" class="arrowBlue" />

  <path d="M270 368 C260 360 252 352 245 344" class="arrowRed" />
  <text x="276" y="326" class="label">抽取暴露模式不足</text>
  <path d="M140 305 C140 270 190 248 718 248 L718 212" class="arrowRed" />
  <text x="58" y="250" class="small">回 L2：批准后修订模式</text>

  <path d="M292 585 C278 578 262 568 245 559" class="arrowRed" />
  <text x="278" y="642" class="label">候选发现被质疑</text>
  <path d="M140 520 C140 470 330 455 600 455 L600 412" class="arrowRed" />
  <text x="58" y="462" class="small">回 L4：必要时补证 / 找反例</text>

  <g id="g6-audit">
    <rect x="982" y="140" width="235" height="460" class="audit" />
    <text x="1099" y="172" text-anchor="middle" class="cardHead">G6 过程证据边界</text>
    <text x="1099" y="198" text-anchor="middle" class="body">仅审计记录 / 横切 L0--L7</text>
    <text x="1099" y="248" text-anchor="middle" class="small">记录：批准、拒绝、修订、回填</text>
    <text x="1099" y="273" text-anchor="middle" class="small">质疑、补证、裁决、脱敏、成本</text>
    <text x="1099" y="328" text-anchor="middle" class="body">用于方法发现</text>
    <text x="1099" y="358" text-anchor="middle" class="cardHead">不作为领域发现证据</text>
    <text x="1099" y="420" text-anchor="middle" class="small">过程证据不能替代</text>
    <text x="1099" y="445" text-anchor="middle" class="small">目标论文中的内容证据</text>
    <text x="1099" y="512" text-anchor="middle" class="small">发布边界需研究者批准</text>
  </g>
  <path d="M930 175 L982 175" class="arrowAudit" />
  <path d="M930 374 L982 374" class="arrowAudit" />
  <path d="M930 585 C960 585 965 535 982 535" class="arrowAudit" />
</svg>
