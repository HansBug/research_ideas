default: gpt-5.5

# ---------------------------------------------------------------------------
# upstreams
#
# 同一个 upstream 的 adapter / base_url / api_key 只在这里写一次，profiles 用
# YAML merge key (`<<: *anchor`) 引用，避免重复粘贴凭据。
#
# 为什么这样可行：
#   1. load_llm_registry() 只读顶层 `default` 与 `profiles`，其他顶层键被忽略，
#      所以 `upstreams` 不需要任何代码改动。
#   2. 锚点由 YAML parser 在 pydantic 之前展开，profile 拿到的是普通字典，
#      LLMConfig(extra="forbid") 仍然成立。
#   3. profile 内显式写同名键即可覆盖锚点值 —— 见下面 glm-5.2 覆盖 adapter。
#
# ⚠️ `python -m utils.llm init --from-env` 走 yaml.safe_dump，会把锚点展平；
#    它是引导命令，覆盖配置需要 --force，正常改配置请直接编辑本文件。
# ---------------------------------------------------------------------------
upstreams:
  openai-relay: &openai_relay
    adapter: openai-responses
    base_url: https://api.example.invalid
    api_key: replace-me

  anthropic: &anthropic
    adapter: anthropic
    base_url: https://api.anthropic.com
    api_key: replace-me

  deepseek: &deepseek
    adapter: deepseek
    base_url: https://api.deepseek.com
    api_key: replace-me

  relay: &relay
    adapter: openai
    base_url: https://relay.example.invalid/v1
    api_key: replace-me

profiles:
  # --- OpenAI relay ------------------------------------------------------
  gpt-5.5:
    <<: *openai_relay
    model: gpt-5.5
    context_window_tokens: 272000
    max_output_tokens: 128000
    pricing:
      prices:
        input_usd_per_million_tokens: 5.0
        output_usd_per_million_tokens: 30.0
        cache_read_usd_per_million_tokens: 0.5
        cache_write_usd_per_million_tokens: 5.0
      source_url: https://developers.openai.com/api/docs/pricing
      verified_on: 2026-08-18
      basis: official_list_price
      scope_note: 'OpenAI direct Standard list price; relay charges may differ; cache misses use ordinary input pricing.'
