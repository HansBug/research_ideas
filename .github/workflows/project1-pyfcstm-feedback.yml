name: project1-pyfcstm-feedback

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'dev/**'
  pull_request:

jobs:
  feedback-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./pyfcstm
      - name: Run pyfcstm feedback migration smoke tests
        env:
          PYTHONPATH: project_1_llm_state_machine_modeling
        run: |
          pytest -q project_1_llm_state_machine_modeling/tests project_1_llm_state_machine_modeling/method/tests
