name: project1-pyfcstm-feedback

on:
  push:
    branches:
      - main
      - 'codex/**'
      - 'dev/**'
  pull_request:

jobs:
  feedback-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./pyfcstm
      - name: Run pyfcstm feedback migration smoke tests
        env:
          PYTHONPATH: project_1_llm_state_machine_modeling
        run: |
          pytest -q project_1_llm_state_machine_modeling/tests project_1_llm_state_machine_modeling/method/tests
      - name: Run paper STM repair contract tests
        env:
          PYTHONPATH: project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/conversion/src:project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/representation/src:project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/smoke/src:project_1_llm_state_machine_modeling
        run: |
          pytest -q \
            project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/conversion/tests \
            project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/representation/tests \
            project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/evaluation/tests \
            project_1_llm_state_machine_modeling/paper_stm_repair/pipeline/smoke/tests
      - name: Export Path 1/Path 2 representative artifacts
        run: |
          PATH1_REF=b4ad12205bccf686a61671d1bdc7c28b1a22bab3
          PATH2_REF=bdb25d93408f0a86f8dde8238e67c1f2bfdbbb59
          git fetch origin \
            ${PATH1_REF}:refs/remotes/origin/pr13-path1-snapshot \
            ${PATH2_REF}:refs/remotes/origin/pr13-path2-snapshot
          git cat-file -e "${PATH1_REF}^{commit}" || { echo "Path 1 snapshot commit is unreachable: ${PATH1_REF}" >&2; exit 1; }
          git cat-file -e "${PATH2_REF}^{commit}" || { echo "Path 2 snapshot commit is unreachable: ${PATH2_REF}" >&2; exit 1; }
          mkdir -p /tmp/pr13_artifacts/path1 /tmp/pr13_artifacts/path2
          git show ${PATH1_REF}:project_1_llm_state_machine_modeling/eval/data/sources_path1.parquet > /tmp/pr13_artifacts/path1/sources_path1.parquet
          git show ${PATH1_REF}:project_1_llm_state_machine_modeling/paper_v1/selection/ref_stms/audited/cara-infusion-pump-formal-spec__01/ref_model.fcstm > /tmp/pr13_artifacts/path1/cara.fcstm
          git show ${PATH1_REF}:project_1_llm_state_machine_modeling/paper_v1/selection/ref_stms/audited/cara-infusion-pump-formal-spec__01/ref_components.json > /tmp/pr13_artifacts/path1/cara_ref_components.json
          git show ${PATH1_REF}:project_1_llm_state_machine_modeling/paper_v1/selection/ref_stms/audited/reusable-and-reliable-flight-control-software-for-a-fail-safe-and-cost-efficient-cubesat-mission-design-and-implementation__01/ref_model.fcstm > /tmp/pr13_artifacts/path1/cubesat.fcstm
          git show ${PATH1_REF}:project_1_llm_state_machine_modeling/paper_v1/selection/ref_stms/audited/reusable-and-reliable-flight-control-software-for-a-fail-safe-and-cost-efficient-cubesat-mission-design-and-implementation__01/ref_components.json > /tmp/pr13_artifacts/path1/cubesat_ref_components.json
          git show ${PATH2_REF}:project_1_llm_state_machine_modeling/eval/data/sources_path2.parquet > /tmp/pr13_artifacts/path2/sources_path2.parquet
          git show ${PATH2_REF}:project_1_llm_state_machine_modeling/eval/data/path2_selection/ref_stms/codex_drafts/008.fcstm > /tmp/pr13_artifacts/path2/008.fcstm
          git show ${PATH2_REF}:project_1_llm_state_machine_modeling/eval/data/path2_selection/ref_stms/codex_drafts/097.fcstm > /tmp/pr13_artifacts/path2/097.fcstm
          git show ${PATH2_REF}:project_1_llm_state_machine_modeling/eval/data/path2_selection/ref_stms/codex_drafts/118.fcstm > /tmp/pr13_artifacts/path2/118.fcstm
      - name: Smoke Path 1/Path 2 representative artifacts
        env:
          PYTHONPATH: project_1_llm_state_machine_modeling
        run: |
          python project_1_llm_state_machine_modeling/tests/helpers/path_branch_smoke.py
