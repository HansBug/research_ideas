name: Paper1 F1 Overleaf scaffold

on:
  pull_request:
    paths:
      - 'project_1_llm_state_machine_modeling/paper_stm_issue_discover/overleaf/**'
      - '.github/workflows/project1-f1-overleaf.yml'
  push:
    branches:
      - paper1/f1-overleaf-scaffold

jobs:
  overleaf-scaffold:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Overleaf-compatible pdfLaTeX toolchain
        run: sudo apt-get update && sudo apt-get install -y latexmk texlive-latex-extra texlive-lang-chinese latex-cjk-chinese texlive-bibtex-extra poppler-utils
      - name: Run F1 deterministic gate
        working-directory: project_1_llm_state_machine_modeling/paper_stm_issue_discover/overleaf
        run: make check
